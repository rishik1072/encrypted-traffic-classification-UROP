# Phase 6: Temporal Window Configuration for Encrypted Traffic Classification

temporal_windows:
  min_packets: 3
  prefix_sizes:
    - 5
    - 10
    - 20
    - 50
    - 100
  window_sizes_sec:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
  sliding_windows:
    - window_sec: 1.0
      stride_sec: 0.5
    - window_sec: 2.0
      stride_sec: 1.0
    - window_sec: 5.0
      stride_sec: 2.0
  confidence_thresholds:
    - 0.60
    - 0.70
    - 0.80
    - 0.90
  low_confidence_label: "LOW_CONFIDENCE"
  features:
    - packet_count
    - byte_count
    - mean_packet_size
    - std_packet_size
    - median_packet_size
    - p95_packet_size
    - mean_iat
    - std_iat
    - median_iat
    - p95_iat
    - forward_packet_count
    - backward_packet_count
    - forward_byte_count
    - backward_byte_count
    - packet_rate
    - byte_rate
    - burst_count
    - mean_burst_size
    - burst_rate
    - direction_switch_count
