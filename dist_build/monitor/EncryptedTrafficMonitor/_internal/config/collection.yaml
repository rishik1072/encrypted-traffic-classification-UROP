# Controlled Traffic Collection Lab Configuration

collection:
  output_directory: "data/raw/metadata"
  metadata_directory: "data/raw/metadata"
  temporary_directory: "data/raw/temp"
  interface: "" # Empty defaults to Scapy auto-selection or loopback / first available
  capture_duration_seconds: 30
  warmup_seconds: 3
  cooldown_seconds: 2
  session_id_format: "{date}_{class_slug}_{seq:03d}"
  automatic_cleanup: true
  minimum_packets: 10
  minimum_bytes: 1000
  target_sessions_per_class: 10

classes:
  Web:
    enabled: true
    description: "Interactive HTTPS browsing, DOM downloads, API queries"
    target_sessions: 10
  Video:
    enabled: true
    description: "Encrypted adaptive streaming (YouTube, Vimeo, Twitch via HTTPS/DASH/HLS)"
    target_sessions: 10
  Messaging:
    enabled: true
    description: "Encrypted instant messaging, presence polling, TLS/WSS chats"
    target_sessions: 10
  VoIP:
    enabled: true
    description: "Real-time encrypted voice calls (SRTP/WebRTC/STUN/TURN)"
    target_sessions: 10
  File Transfer:
    enabled: true
    description: "Large encrypted downloads/uploads (SFTP, HTTPS bulk binary)"
    target_sessions: 10
  Other:
    enabled: true
    description: "Encrypted background synchronization, NTP, DNS-over-HTTPS (DoH), telemetry"
    target_sessions: 10
