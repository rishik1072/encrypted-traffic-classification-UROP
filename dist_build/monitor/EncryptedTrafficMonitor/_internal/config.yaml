# Real-Time Encrypted Traffic Classification Configuration

project:
  name: "encrypted-traffic-classification"
  version: "0.1.0"
  description: "Real-Time Encrypted Traffic Classification Using Lightweight ML Models"
  random_seed: 42

traffic_classes:
  - Web
  - Video
  - Messaging
  - VoIP
  - "File Transfer"
  - Other

dataset:
  manifest_path: "data/dataset_manifest.csv"
  raw_pcap_directory: "data/raw/pcap"
  flow_output_path: "data/processed/flows/flows.csv"
  feature_output_path: "data/processed/features/features.csv"
  cleaned_feature_output_path: "data/processed/features/features_cleaned.csv"
  split_directory: "data/processed/splits"
  cleaning_report_path: "results/tables/dataset_cleaning_report.csv"
  class_distribution_path: "results/tables/class_distribution.csv"
  feature_statistics_path: "results/tables/feature_statistics.csv"
  figures_directory: "results/figures"

dataset_quality:
  minimum_packets_for_training: 3
  minimum_bytes_for_training: 128
  artifact_review_enabled: true

splitting:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  group_column: "file_id"
  stratify: true
  random_seed: 42

capture:
  interface: null
  pcap_filter: "ip or ip6"
  promiscuous: true
  snaplen: 262144
  buffer_size_mb: 64

flows:
  idle_timeout_seconds: 60.0
  active_timeout_seconds: 1800.0
  min_packets_for_classification: 3
  max_packets_per_flow: 10000

features:
  numerical_features:
    - flow_duration
    - forward_packet_count
    - backward_packet_count
    - total_packet_count
    - forward_bytes
    - backward_bytes
    - total_bytes
    - avg_packet_size
    - min_packet_size
    - max_packet_size
    - packet_size_variance
    - mean_iat
    - median_iat
    - iat_std
    - min_iat
    - max_iat
    - fwd_bwd_packet_ratio
    - fwd_bwd_byte_ratio
    - burst_count
    - avg_burst_bytes
    - avg_burst_packets
  categorical_features:
    - protocol
    - dst_port
  tls_features:
    - tls_version
    - tls_cipher_suites_count
    - tls_extensions_count
    - tls_sni_present
  missing_value_strategy:
    numerical: "median"
    categorical: "constant"

feature_selection:
  candidate_k_subsets: [21, 15, 10, 5, 3]
  correlation_threshold: 0.85
  ranking_weights:
    mutual_information: 0.25
    random_forest: 0.35
    lightgbm: 0.30
    permutation: 0.10

lightweight_score_weights:
  macro_f1: 0.45
  latency: 0.25
  model_size: 0.20
  memory: 0.10

model_complexity:
  random_forest:
    baseline: { n_estimators: 100, max_depth: 15 }
    reduced_estimators: { n_estimators: 25, max_depth: 15 }
    reduced_depth: { n_estimators: 25, max_depth: 6 }
  decision_tree:
    baseline: { max_depth: 12 }
    reduced_depth: { max_depth: 5 }
  lightgbm:
    baseline: { n_estimators: 100, num_leaves: 31 }
    reduced_estimators: { n_estimators: 25, num_leaves: 31 }
    reduced_leaves: { n_estimators: 25, num_leaves: 12 }

models:
  logistic_regression:
    max_iter: 1000
    solver: "lbfgs"
    C: 1.0
    random_state: 42
  decision_tree:
    max_depth: 12
    min_samples_split: 5
    criterion: "gini"
    random_state: 42
  random_forest:
    n_estimators: 100
    max_depth: 15
    min_samples_split: 4
    n_jobs: -1
    random_state: 42
  lightgbm:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 31
    objective: "multiclass"
    verbose: -1
    random_state: 42

benchmark:
  warmup_runs: 50
  benchmark_runs: 500
  batch_size: 32
  measure_cpu: true
  measure_memory: true

evaluation:
  primary_metric: "f1_macro"
  averaging: "macro"
  cross_validation_folds: 5

realtime:
  model: "lightgbm"
  feature_profile: "baseline"
  interface: null
  flow_timeout_seconds: 120.0
  idle_timeout_seconds: 60.0
  prediction_interval_seconds: 1.0
  minimum_packets: 3
  minimum_bytes: 128
  confidence_threshold: 0.70
  queue_maxsize: 10000
  update_interval_seconds: 0.5
  cleanup_interval_seconds: 30.0
  predictions_csv_path: "results/realtime/predictions.csv"
  predictions_jsonl_path: "results/realtime/predictions.jsonl"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] [%(name)s]: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
