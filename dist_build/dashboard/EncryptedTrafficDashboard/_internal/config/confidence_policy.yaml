# Versioned Confidence Policy & Selective Abstention Rules

confidence_policy:
  version: "1.0.0"
  policy_id: "phase9_conservative_abstention"
  default_state: "LOW_CONFIDENCE"
  minimum_packets_evidence: 5
  minimum_bytes_evidence: 128
  
  thresholds:
    high_confidence_tau: 0.70
    low_confidence_tau: 0.35
    coarse_family_tau: 0.50
    
  calibration_method: "Platt_Scaling_Sigmoid"
  threshold_source: "Phase 8 Development Cross-Validation & ROC Optimization"
  coverage_estimate: 0.1793
  validation_dataset: "dataset_v1_warp_wireguard (60 flows / 12 sessions)"
  
  states:
    INSUFFICIENT_EVIDENCE:
      condition: "packet_count < 5"
      description: "Flow has not generated enough packets to establish statistical characteristics."
    UNKNOWN:
      condition: "confidence < 0.35"
      description: "Flow feature vector does not conform to known training distributions."
    LOW_CONFIDENCE:
      condition: "0.35 <= confidence < 0.70"
      description: "Flow exhibits ambiguous features overlapping multiple class profiles."
    KNOWN_CLASS:
      condition: "confidence >= 0.70 and packet_count >= 5"
      description: "High-confidence attribution passing locked deployment gate."
    FLOW_COMPLETED:
      condition: "flow terminated or expired"
      description: "Flow lifecycle ended."
