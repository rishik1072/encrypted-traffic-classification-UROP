<svg xmlns="http://www.w3.org/2000/svg" width="750" height="450" viewBox="0 0 750 450">
  <style>
    .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e293b; }
    .subtitle { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #64748b; }
    .axis { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #475569; }
    .bar-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff" rx="6" />
  <text x="30" y="35" class="title">Per-Class F1-Score Breakdown (Held-Out Test Set)</text>
  <text x="30" y="55" class="subtitle">Detailed per-class performance across all 6 real traffic classes</text>
  <line x1="80" y1="350" x2="700" y2="350" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="100" y="303" width="70" height="47" fill="#3b82f6" rx="3" />
  <text x="135" y="326" class="bar-text">0.19</text>
  <text x="135" y="370" class="axis" text-anchor="middle">File Transfer</text>
  <rect x="195" y="350" width="70" height="0" fill="#3b82f6" rx="3" />
  <text x="230" y="366" class="bar-text">0.00</text>
  <text x="230" y="370" class="axis" text-anchor="middle">Messaging</text>
  <rect x="290" y="319" width="70" height="31" fill="#3b82f6" rx="3" />
  <text x="325" y="335" class="bar-text">0.12</text>
  <text x="325" y="370" class="axis" text-anchor="middle">Other</text>
  <rect x="385" y="350" width="70" height="0" fill="#3b82f6" rx="3" />
  <text x="420" y="366" class="bar-text">0.00</text>
  <text x="420" y="370" class="axis" text-anchor="middle">Video</text>
  <rect x="480" y="350" width="70" height="0" fill="#3b82f6" rx="3" />
  <text x="515" y="366" class="bar-text">0.00</text>
  <text x="515" y="370" class="axis" text-anchor="middle">VoIP</text>
  <rect x="575" y="330" width="70" height="20" fill="#3b82f6" rx="3" />
  <text x="610" y="346" class="bar-text">0.08</text>
  <text x="610" y="370" class="axis" text-anchor="middle">Web</text>
</svg>